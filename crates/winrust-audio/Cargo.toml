[package]
name = "winrust-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Audio engine for winrust: cpal output, symphonia decoding, ring buffer playback"

[dependencies]
winrust-core = { workspace = true }
winrust-dsp = { workspace = true }

cpal = "0.18"
symphonia = { version = "0.5", features = ["all"] }
rubato = "5.0"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
thiserror = { workspace = true }
tracing = { workspace = true }
parking_lot = "0.12"

[dev-dependencies]
winrust-ytmusic = { workspace = true }
tokio = { workspace = true }
